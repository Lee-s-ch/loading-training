<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>출하 안전 교육</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700;800&display=swap">
<style>:root{color-scheme:light}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>

<body>
<title>출하 시뮬레이터</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: one working screen. 3D loading bay on the left, interlock panel and work order on the right; stacks on phones. */
:root {
  --bg: #f3f5f3;
  --surface: #ffffff;
  --ink: #1f2522;
  --muted: #5f6763;
  --line: #d5dad7;
  --accent: #0a7a52;
  --accent-soft: #e4f2eb;
  --warn: #b8410f;
  --warn-soft: #fbeee6;
  --scene: #e6ebe8;
  --font-body: "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #121614; --surface: #1b211e; --ink: #e8ece9; --muted: #a2aba6; --line: #2f3833;
    --accent: #3fb07f; --accent-soft: #17352a; --warn: #f08a5d; --warn-soft: #3a221a; --scene: #1a201d;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #121614; --surface: #1b211e; --ink: #e8ece9; --muted: #a2aba6; --line: #2f3833;
  --accent: #3fb07f; --accent-soft: #17352a; --warn: #f08a5d; --warn-soft: #3a221a; --scene: #1a201d;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 14px; line-height: 1.55;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 16px 24px;
}
header { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 16px; margin-bottom: 12px; }
h1 { font-size: 20px; font-weight: 700; margin: 0; text-wrap: balance; }
header p { margin: 0; color: var(--muted); min-width: 0; }
.app { display: grid; grid-template-columns: minmax(0, 1fr) 12px var(--pw, 350px); gap: 2px; align-items: start; }
.vsplit, .hsplit { position: relative; touch-action: none; }
.vsplit { cursor: col-resize; } .hsplit { cursor: row-resize; height: 12px; flex: none; }
.vsplit::after, .hsplit::after { content: ""; position: absolute; left: 50%; top: 50%; border-radius: 3px; background: var(--line); transition: background .15s; }
.vsplit::after { width: 4px; height: 48px; margin: -24px 0 0 -2px; } .hsplit::after { width: 48px; height: 4px; margin: -2px 0 0 -24px; }
.vsplit:hover::after, .hsplit:hover::after, .vsplit.on::after, .hsplit.on::after { background: var(--accent); }
.panel { zoom: var(--zp, 1); }
.views, .hud, .caption, .banner, .prompt, .toast, .alarm, .hint, .pad, .tip, .tag, .cross { zoom: var(--zs, 1); }
@media (max-width: 900px) { .app { grid-template-columns: minmax(0, 1fr); } .vsplit, .hsplit { display: none; } .panel, .dock { zoom: 1 !important; } }
.main { display: flex; flex-direction: column; gap: 0; min-width: 0; }
.dock { display: grid; grid-template-columns: minmax(0, 1.35fr) minmax(0, 1fr); gap: 12px; }
.dock .card { padding: 10px 12px; overflow-y: auto; overscroll-behavior: contain; }
.dock .card h2 { margin-bottom: 6px; }
.dock .card-head { margin-bottom: 6px; }
@media (max-width: 600px) { .dock { grid-template-columns: minmax(0, 1fr); } }
@media (min-width: 901px) {
  html, body { height: 100%; }
  body { display: flex; flex-direction: column; overflow: hidden; padding-block: 10px; }
  header { flex: none; margin-bottom: 8px; }
  .app { flex: 1; min-height: 0; align-items: stretch; }
  .main { height: 100%; min-height: 0; }
  .stage { flex: 1 1 auto; height: auto; min-height: 240px; }
  .dock { flex: none; }
  .panel { height: 100%; overflow-y: auto; overscroll-behavior: contain; padding-right: 4px; scrollbar-gutter: stable; }
}
@media (min-width: 901px) { .dock { zoom: var(--zd, 1); height: calc(var(--dh, 172px) / var(--zd, 1)); } .dock .card { height: 100%; } }
.howto { font-size: 11.5px; color: var(--muted); margin: 8px 0 0; }
.howto b { color: var(--ink); margin-right: 4px; }
.info .hold { margin-top: 2px; font-size: 11.5px; }

.stage { position: relative; height: clamp(380px, 74vh, 780px); border-radius: 12px; overflow: hidden; background: var(--scene); border: 1px solid var(--line); }
.stage canvas { display: block; width: 100%; height: 100%; touch-action: none; }
.views { position: absolute; top: 12px; left: 12px; display: flex; flex-wrap: wrap; gap: 6px; max-width: calc(100% - 24px); z-index: 3; }
.views button { font: 500 12px var(--font-body); padding: 5px 10px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); cursor: pointer; }
.views button[aria-pressed="true"] { background: var(--ink); color: var(--surface); border-color: var(--ink); }
.hud { position: absolute; top: 12px; right: 12px; z-index: 3; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 6px 10px 8px; display: grid; grid-template-columns: auto auto; gap: 0 8px; align-items: baseline; min-width: 150px; pointer-events: none; }
.hud span { font-size: 11px; color: var(--muted); }
.hud b { font: 700 16px var(--font-mono); font-variant-numeric: tabular-nums; text-align: right; }
.hud i { grid-column: 1 / -1; font-style: normal; font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; }
.hud.hot b, .hud.hot i { color: var(--warn); }
.kvbar { grid-column: 1 / -1; position: relative; height: 5px; border-radius: 3px; background: var(--line); margin-top: 4px; overflow: hidden; }
.kvbar #kvfill { position: absolute; inset: 0 auto 0 0; width: 0; background: var(--accent); }
.hud.hot .kvbar #kvfill { background: var(--warn); }
.kvbar .mie { position: absolute; top: -2px; bottom: -2px; left: 13.6%; width: 2px; background: var(--ink); }
.banner { position: absolute; left: 50%; top: 96px; transform: translateX(-50%); z-index: 4; pointer-events: none; font-size: 15px; font-weight: 700; padding: 9px 16px; border-radius: 10px; max-width: calc(100% - 24px); text-align: center; color: #fff; background: #c0392b; box-shadow: 0 6px 20px rgba(0,0,0,.25); }
.banner small { display: block; font-size: 12px; font-weight: 500; opacity: .9; margin-top: 2px; }
.banner.safe { background: var(--accent); }
.hint { position: absolute; left: 12px; bottom: 10px; font-size: 11px; color: var(--muted); z-index: 3; pointer-events: none; max-width: 30%; }
.prompt { position: absolute; left: 50%; bottom: 14px; transform: translateX(-50%); z-index: 3; cursor: pointer; border: 0; background: var(--ink); color: var(--surface); font: 500 13px var(--font-body); padding: 7px 14px; border-radius: 999px; white-space: nowrap; max-width: calc(100% - 24px); overflow: hidden; text-overflow: ellipsis; }
.prompt kbd { font: 700 12px var(--font-mono); background: var(--surface); color: var(--ink); border-radius: 4px; padding: 0 6px; margin-right: 6px; }
.caption { position: absolute; left: 50%; top: 52px; transform: translateX(-50%); z-index: 3; pointer-events: none; background: var(--surface); color: var(--ink); border: 1px solid var(--accent); font-size: 14px; font-weight: 700; padding: 6px 14px; border-radius: 8px; max-width: calc(100% - 24px); text-align: center; }
.caption small { font-weight: 500; color: var(--muted); margin-right: 8px; font-variant-numeric: tabular-nums; }
.toast { position: absolute; left: 50%; top: 150px; transform: translateX(-50%); z-index: 4; pointer-events: none; background: var(--warn); color: #fff; font-size: 13px; font-weight: 700; padding: 7px 14px; border-radius: 8px; max-width: calc(100% - 24px); text-align: center; }
.tip { position: absolute; z-index: 4; pointer-events: none; background: var(--surface); color: var(--ink); border: 1px solid var(--line); font-size: 12px; padding: 4px 8px; border-radius: 6px; white-space: nowrap; transform: translate(12px, 12px); }
.tip.far { color: var(--warn); }
.stage canvas.hot { cursor: pointer; }
.stage canvas:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
.cross { position: absolute; left: 50%; top: 50%; width: 6px; height: 6px; margin: -3px 0 0 -3px; border-radius: 50%; background: var(--surface); border: 1px solid var(--ink); z-index: 3; pointer-events: none; }
.pad { position: absolute; left: 12px; bottom: 44px; z-index: 3; display: none; grid-template-columns: repeat(3, 44px); grid-template-rows: repeat(2, 44px); gap: 4px; }
.pad button { font: 700 15px var(--font-body); border: 1px solid var(--line); border-radius: 10px; background: var(--surface); color: var(--ink); touch-action: none; user-select: none; -webkit-user-select: none; }
.pad .u { grid-column: 2; }
.pad .l { grid-column: 1; grid-row: 2; } .pad .d { grid-column: 2; grid-row: 2; } .pad .r { grid-column: 3; grid-row: 2; }
@media (pointer: coarse) { .pad { display: grid; } .hint { display: none; } }
@media (max-width: 600px) { .hud { top: auto; bottom: 56px; min-width: 130px; } .caption { top: 88px; font-size: 13px; } .banner { top: 132px; font-size: 14px; } }
.keys { display: grid; grid-template-columns: auto 1fr; gap: 4px 8px; font-size: 12px; align-items: center; }
.keys kbd { font: 700 11.5px var(--font-mono); border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 4px; padding: 1px 6px; text-align: center; white-space: nowrap; }
.hold { margin-top: 8px; font-size: 12px; color: var(--muted); }
.hold b { color: var(--ink); }
.alarm { position: absolute; right: 12px; bottom: 12px; z-index: 3; background: var(--warn); color: #fff; font-weight: 700; font-size: 13px; padding: 8px 12px; border-radius: 8px; }
.labels { position: absolute; inset: 0; pointer-events: none; z-index: 2; }
.tag {
  position: absolute; transform: translate(-50%, -100%); pointer-events: auto; cursor: pointer; white-space: nowrap;
  font: 500 10px var(--font-body); color: var(--ink); background: var(--surface); border: 1px solid var(--line);
  padding: 2px 6px 2px 5px; border-radius: 999px; display: flex; align-items: center; gap: 5px;
}
.tag::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--muted); }
.tag.new::before { background: var(--accent); }
.tag[aria-pressed="true"] { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-soft); }
.tag.alert { background: #c0392b; border-color: #c0392b; color: #fff; font-weight: 700; font-size: 11px; padding: 3px 9px 3px 7px; animation: blink 0.8s steps(2, start) infinite; z-index: 1; }
.tag.alert::before { background: #fff; }
@keyframes blink { 50% { background: #7f1d14; border-color: #7f1d14; } }
.tag:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.panel { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; min-width: 0; }
.card h2 { font-size: 12px; font-weight: 700; letter-spacing: .04em; color: var(--muted); margin: 0 0 10px; }
.card-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 10px; }
.card-head h2 { margin: 0; }
.link-btn { font: 500 12px var(--font-body); color: var(--muted); background: none; border: 1px solid var(--line); border-radius: 6px; padding: 3px 9px; cursor: pointer; }
.link-btn:hover { color: var(--ink); border-color: var(--muted); }
.head-btns { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
.link-btn.play { color: var(--accent); border-color: var(--accent); font-weight: 700; }
.link-btn.play[aria-pressed="true"] { background: var(--accent); color: var(--surface); }
.status { border-width: 2px; }
.status .big { font-size: 22px; font-weight: 700; line-height: 1.2; }
.status .why { color: var(--muted); margin: 2px 0 8px; font-size: 12.5px; }
.status.ok { border-color: var(--accent); } .status.ok .big { color: var(--accent); }
.status.stop { border-color: var(--warn); } .status.stop .big { color: var(--warn); }
.status.run { border-color: var(--accent); background: var(--accent-soft); } .status.run .big { color: var(--accent); }
.conds { display: grid; gap: 6px; }
.cond { display: flex; align-items: center; gap: 8px; font-size: 13px; }
.dot { width: 10px; height: 10px; border-radius: 50%; background: var(--warn); flex: none; }
.dot.on { background: var(--accent); }
.chip { margin-left: auto; font-size: 11px; padding: 1px 8px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); flex: none; }
.chip.new { border-color: var(--accent); color: var(--accent); }
.gate { font-size: 11.5px; color: var(--muted); margin: 8px 0 0; }
.panel .card { padding: 10px 12px; }
.panel { gap: 10px !important; }
.fire-btns { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.fbtn { font: 700 13px var(--font-body); padding: 8px; border-radius: 8px; cursor: pointer; border: 1px solid; background: var(--surface); line-height: 1.3; }
.fbtn small { display: block; font-size: 11px; font-weight: 500; opacity: .8; }
.fbtn.bad { color: var(--warn); border-color: var(--warn); }
.fbtn.good { color: var(--accent); border-color: var(--accent); }
.fbtn.bad:hover, .fbtn.bad[aria-pressed="true"] { background: var(--warn-soft); }
.fbtn.good:hover, .fbtn.good[aria-pressed="true"] { background: var(--accent-soft); }
.fire .note { margin-top: 6px; }

.row { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 4px 0; font-size: 12.5px; }
.ctl .seg { margin-bottom: 4px; }
.seg.seg4 { grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 4px; }
.seg.seg4 label { padding: 5px 2px; font-size: 11.5px; }
.ctl .seg small { display: inline; margin-left: 4px; }
.panel .ctl { padding-block: 10px; }
.ctl h2 { margin-bottom: 4px !important; }
.switch { position: relative; display: inline-flex; flex: none; }
.switch input { position: absolute; inset: 0; z-index: 1; opacity: 0; width: 100%; height: 100%; margin: 0; cursor: pointer; }
.switch span { width: 40px; height: 22px; border-radius: 999px; background: var(--line); position: relative; transition: background .15s; }
.switch span::after { content: ""; position: absolute; top: 3px; left: 3px; width: 16px; height: 16px; border-radius: 50%; background: #fff; transition: transform .15s; }
.switch input:checked + span { background: var(--accent); }
.switch input:checked + span::after { transform: translateX(18px); }
.switch input:focus-visible + span { outline: 2px solid var(--accent); outline-offset: 2px; }
fieldset { border: 0; padding: 0; margin: 8px 0 0; min-width: 0; }
fieldset:first-of-type { margin-top: 0; }
legend { font-size: 13px; padding: 0; margin-bottom: 6px; }
.seg { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.seg label { position: relative; font-size: 12.5px; border: 1px solid var(--line); border-radius: 8px; padding: 5px 6px; cursor: pointer; text-align: center; }
.seg input { position: absolute; opacity: 0; inset: 0; margin: 0; cursor: pointer; }
.seg label:has(input:checked) { border-color: var(--ink); background: var(--ink); color: var(--surface); }
.seg label:has(input:focus-visible) { outline: 2px solid var(--accent); outline-offset: 2px; }
.seg label:has(input:disabled) { opacity: .5; cursor: not-allowed; }
.seg small { display: block; font-size: 11px; opacity: .75; }
.divider { height: 1px; background: var(--line); margin: 12px 0 4px; }
.gauge { margin-top: 6px; }
.track { position: relative; height: 8px; border-radius: 4px; background: var(--line); }
.track .band { position: absolute; left: 33.3%; width: 33.3%; top: 0; bottom: 0; background: var(--accent); opacity: .45; }
.track .pin { position: absolute; top: 50%; width: 14px; height: 14px; border-radius: 50%; transform: translate(-50%, -50%); border: 2px solid var(--surface); transition: left .3s; }
.scale { display: flex; justify-content: space-between; font-size: 10.5px; color: var(--muted); margin-top: 4px; }
.verdict { font-size: 11.5px; margin-top: 4px; }
.verdict b.ok { color: var(--accent); } .verdict b.bad { color: var(--warn); }
.note { font-size: 12px; color: var(--muted); margin: 8px 0 0; }
.log { list-style: none; margin: 0; padding: 0; display: grid; gap: 3px; font-size: 12px; }
.log li { display: flex; gap: 8px; min-width: 0; }
.log li.empty { color: var(--muted); }
.log time { font-family: var(--font-mono); font-size: 11.5px; color: var(--muted); flex: none; font-variant-numeric: tabular-nums; }
.log .w { color: var(--warn); font-weight: 700; }
.log .g { color: var(--accent); font-weight: 700; }
.info h3 { font-size: 14px; margin: 0 0 3px; }
.info p { margin: 0; font-size: 12.5px; }
.info .spec { font-family: var(--font-mono); color: var(--accent); font-size: 12px; margin-top: 6px; }
.steps { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: minmax(0, 1fr); gap: 3px; }
.steps li { min-width: 0; }
.steps button { width: 100%; display: flex; align-items: center; gap: 10px; text-align: left; font: 500 12.5px var(--font-body); color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 2px 9px; cursor: pointer; line-height: 1.2; min-width: 0; }
.steps .n { width: 20px; height: 20px; border-radius: 50%; display: grid; place-items: center; font-size: 12px; font-weight: 700; background: var(--line); color: var(--ink); flex: none; }
.steps .t { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.steps .t small { display: inline; margin-left: 6px; font-size: 10.5px; color: var(--muted); font-weight: 400; }
.steps .s { font-size: 11.5px; color: var(--muted); flex: none; }
.steps button.isnew .t b { color: var(--accent); font-weight: 700; }
.steps button.next { border-color: var(--accent); background: var(--accent-soft); }
.steps button.next .n { background: var(--accent); color: #fff; }
.steps button.done .n { background: var(--ink); color: var(--surface); }
.steps button.done .s { color: var(--accent); }
.steps button.running { border-color: var(--accent); }
.steps button.running .s { color: var(--accent); font-weight: 700; }
.steps button:disabled { opacity: .45; cursor: not-allowed; }
@media (prefers-reduced-motion: reduce) { .track .pin, .switch span, .switch span::after { transition: none; } .tag.alert { animation: none; } }
</style>

<header>
  <h1>출하 시뮬레이터</h1>
  <p id="sceneDesc"></p>
</header>

<div class="app">
  <div class="main">
    <section class="stage" id="stage" aria-label="출하대 3D 장면">
      <div class="views" role="group" aria-label="시점">
        <button type="button" data-view="all" aria-pressed="true">전체</button>
        <button type="button" data-view="follow" aria-pressed="false">기사 따라가기</button>
        <button type="button" data-view="fp" aria-pressed="false">1인칭</button>
        <button type="button" data-view="lc" aria-pressed="false">하부 LC</button>
        <button type="button" data-view="work" aria-pressed="false" id="viewWork">상부 LC</button>
        <button type="button" id="hq" aria-pressed="false" title="주변광 차폐와 고해상도 그림자. 느리면 끄세요">고품질</button>
      </div>
      <div class="hud" id="hud" aria-live="off">
        <span>인체 전위</span><b id="kv">0.0 kV</b><i id="mj">방전 시 0.00 mJ</i>
        <div class="kvbar"><div id="kvfill"></div><div class="mie" title="휘발유 증기 최소점화에너지 0.2 mJ에 해당하는 전위"></div></div>
      </div>
      <div class="labels" id="labels"></div>
      <div class="caption" id="caption" hidden></div>
      <div class="banner" id="banner" hidden></div>
      <div class="cross" id="cross" hidden></div>
      <div class="alarm" id="alarm" hidden></div>
      <div class="hint" id="hint">드래그 회전 · 휠 확대 · 라벨을 누르면 설명</div>
      <div class="pad" aria-label="이동">
        <button type="button" class="u" data-key="KeyW" aria-label="앞으로">▲</button>
        <button type="button" class="l" data-key="KeyA" aria-label="왼쪽">◀</button>
        <button type="button" class="d" data-key="KeyS" aria-label="뒤로">▼</button>
        <button type="button" class="r" data-key="KeyD" aria-label="오른쪽">▶</button>
      </div>
      <button type="button" class="prompt" id="prompt"></button>
      <div class="toast" id="toast" hidden></div>
      <div class="tip" id="tip" hidden></div>
    </section>

    <div class="hsplit" id="hsplit" role="separator" aria-orientation="horizontal" aria-label="화면 높이 조절 (더블클릭: 기본값)" title="끌어서 높이 조절 · 더블클릭: 기본값"></div>

class Coil extends THREE.Curve {
  constructor(a, b, sag, r, turns) { super(); Object.assign(this, { a, b, sag, r, turns }); }
  getPoint(t, target = new THREE.Vector3()) {
    const { a, b } = this;
    const p = a.clone().lerp(b, t); p.y -= this.sag * 4 * t * (1 - t);
    const dir = b.clone().sub(a).normalize();
    let u = new THREE.Vector3().crossVectors(dir, V(0, 1, 0));
    if (u.lengthSq() < 1e-4) u.set(1, 0, 0);
    u.normalize();
    const w = new THREE.Vector3().crossVectors(dir, u).normalize();
    const env = THREE.MathUtils.smoothstep(t, 0.1, 0.2) * (1 - THREE.MathUtils.smoothstep(t, 0.72, 0.8));
    const th = t * this.turns * Math.PI * 2;
    return target.copy(p).addScaledVector(u, Math.cos(th) * this.r * env).addScaledVector(w, Math.sin(th) * this.r * env);
  }
}
class Part extends THREE.Curve {
  constructor(c, t0, t1, drop = 0) { super(); Object.assign(this, { c, t0, t1, drop }); }
  getPoint(t, target = new THREE.Vector3()) {
    this.c.getPoint(this.t0 + (this.t1 - this.t0) * t, target);
    target.y -= this.drop * THREE.MathUtils.smoothstep(t, 0.55, 1) * t * t;
    return target;
  }
}
